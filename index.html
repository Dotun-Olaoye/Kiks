<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allele Frequency Simulator</title>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            animation: {
              'fade-in': 'fadeIn 1s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
            },
          },
        },
      };
    </script>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; /* Dark charcoal background */
            overflow: hidden; /* Prevent body scroll due to animation */
        }
        
        /* New background container for the letters */
        .genetics-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .genetics-background .base {
            position: absolute;
            color: rgba(79, 209, 197, 0.4); /* Teal color for the letters */
            font-size: 3rem; /* Default size */
            animation-duration: 40s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            text-shadow: 0 0 5px rgba(79, 209, 197, 0.3); /* Soft glow effect */
            user-select: none;
        }

        /* Define animation for the letters */
        @keyframes drift {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.1;
            }
            80% {
                opacity: 0.1;
            }
            100% {
                transform: translate(calc(var(--x-end) * 1px), calc(var(--y-end) * 1px)) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Override default animation settings for a more staggered effect */
        .genetics-background .base:nth-child(2n) { animation-duration: 50s; }
        .genetics-background .base:nth-child(3n) { animation-duration: 60s; }
        .genetics-background .base:nth-child(4n) { animation-duration: 45s; }
        .genetics-background .base:nth-child(5n) { animation-duration: 55s; }


        .container {
            max-width: 1024px;
            margin-left: auto;
            margin-right: auto;
            padding: 2rem;
        }
        .card {
            background-color: #2d3748; /* Slightly lighter dark gray */
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        input[type="range"]::-webkit-slider-thumb {
            background: #4fd1c5; /* Teal thumb */
        }
        input[type="range"]::-moz-range-thumb {
            background: #4fd1c5; /* Teal thumb */
        }
        canvas {
            display: block;
            width: 100%;
            height: 400px;
        }
        .info-box {
            background-color: #4a5568;
            border-radius: 0.5rem;
            padding: 1rem;
        }
    </style>
</head>
<body class="text-gray-200">
    <!-- The new background layer -->
    <div class="genetics-background"></div>

    <div class="container">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-bold text-white mb-2">Allele Frequency Simulator</h1>
            <p class="text-xl text-gray-400">This tool explores how allele frequency changes over time.</p>
        </header>

        <main class="grid lg:grid-cols-3 gap-8">
            <!-- Left sidebar for controls -->
            <div class="lg:col-span-1">
                <div class="card space-y-6">
                    <h2 class="text-2xl font-bold text-white">Parameters</h2>

                    <!-- Initial Allele Frequency (p) -->
                    <div>
                        <label for="initialP" class="block text-gray-300">Initial Frequency of 'A': <span id="p-value" class="font-bold text-teal-400">0.5</span></label>
                        <input type="range" id="initialP" name="initialP" min="0" max="1" step="0.01" value="0.5" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Population Size -->
                    <div>
                        <label for="popSize" class="block text-gray-300">Population Size (N): <span id="n-value" class="font-bold text-teal-400">100</span></label>
                        <input type="range" id="popSize" name="popSize" min="10" max="100000" step="100" value="100" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Number of Generations -->
                    <div>
                        <label for="generations" class="block text-gray-300">Generations: <span id="gen-value" class="font-bold text-teal-400">200</span></label>
                        <input type="range" id="generations" name="generations" min="10" max="1000" step="10" value="200" class="w-full h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Fitness Values -->
                    <div>
                        <h3 class="text-xl font-bold text-white mb-2">Relative Fitness</h3>
                        <div class="flex flex-col md:flex-row md:space-x-4 space-y-4 md:space-y-0">
                            <div>
                                <label for="w_aa" class="block text-gray-300">AA:</label>
                                <input type="number" id="w_aa" name="w_aa" value="1.0" min="0" step="0.01" class="w-full bg-gray-600 rounded-lg p-2 text-white border-none">
                            </div>
                            <div>
                                <label for="w_aA" class="block text-gray-300">Aa:</label>
                                <input type="number" id="w_aA" name="w_aA" value="1.0" min="0" step="0.01" class="w-full bg-gray-600 rounded-lg p-2 text-white border-none">
                            </div>
                            <div>
                                <label for="w_aa_recessive" class="block text-gray-300">aa:</label>
                                <input type="number" id="w_aa_recessive" name="w_aa_recessive" value="1.0" min="0" step="0.01" class="w-full bg-gray-600 rounded-lg p-2 text-white border-none">
                            </div>
                        </div>
                    </div>

                    <button id="run-button" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">Run Simulation</button>
                    <button id="reset-button" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg transition-colors">Reset</button>

                </div>
            </div>

            <!-- Main content area for plot and info -->
            <div class="lg:col-span-2">
                <div class="card space-y-6">
                    <div class="info-box">
                        <p><strong>Current Generation:</strong> <span id="current-gen">0</span></p>
                        <p><strong>Frequency of A:</strong> <span id="current-p">0.5</span></p>
                        <p><strong>Frequency of a:</strong> <span id="current-q">0.5</span></p>
                    </div>
                    <div class="aspect-w-16 aspect-h-9">
                        <canvas id="plot-canvas" class="bg-gray-800 rounded-lg border-2 border-gray-700"></canvas>
                    </div>
                    <div class="flex items-center space-x-4 mt-4">
                        <div class="flex items-center space-x-2">
                            <span class="w-4 h-4 bg-red-500 rounded-full"></span>
                            <span>Frequency of 'A'</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="w-4 h-4 bg-blue-400 rounded-full"></span>
                            <span>Frequency of 'a'</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <!-- 📬 Email Footer -->
        <footer class="fixed bottom-0 w-full text-center bg-gray-800 text-gray-200 text-sm py-4">
    <p>
      <span class="mr-1">✉️</span>
      <a href="mailto:olaoyedotun@gmail.com" class="hover:underline">
        olaoyedotun@gmail.com
      </a>
    </p>
  </footer>

    </div>

    <script>
        // Get references to all HTML elements for user input and display
        const initialPInput = document.getElementById('initialP');
        const popSizeInput = document.getElementById('popSize');
        const generationsInput = document.getElementById('generations');
        const w_aaInput = document.getElementById('w_aa');
        const w_aAInput = document.getElementById('w_aA');
        const w_aa_recessiveInput = document.getElementById('w_aa_recessive');

        const pValueDisplay = document.getElementById('p-value');
        const nValueDisplay = document.getElementById('n-value');
        const genValueDisplay = document.getElementById('gen-value');

        const runButton = document.getElementById('run-button');
        const resetButton = document.getElementById('reset-button');
        const currentGenDisplay = document.getElementById('current-gen');
        const currentPDisplay = document.getElementById('current-p');
        const currentQDisplay = document.getElementById('current-q');

        const canvas = document.getElementById('plot-canvas');
        const ctx = canvas.getContext('2d');

        // State variables for the simulation
        let p;
        let pHistory;
        let qHistory;
        let currentGen;
        let isSimulating = false;
        
        // Variables to store the counts of each genotype
        let num_AA;
        let num_Aa;
        let num_aa;
        
        // Variables for hover functionality on the canvas plot
        let hoverGeneration = null;
        let hoverP = null;
        let hoverQ = null;

        // Function to create and append the background letters
        const createBackgroundLetters = () => {
            const backgroundContainer = document.querySelector('.genetics-background');
            const letters = ['A', 'C', 'T', 'G'];
            const numLetters = 50;

            for (let i = 0; i < numLetters; i++) {
                const letter = document.createElement('div');
                letter.textContent = letters[Math.floor(Math.random() * letters.length)];
                letter.classList.add('base');

                // Randomize position and animation properties
                const startX = Math.random() * window.innerWidth;
                const startY = Math.random() * window.innerHeight;
                const endX = startX + (Math.random() - 0.5) * window.innerWidth * 0.8;
                const endY = startY + (Math.random() - 0.5) * window.innerHeight * 0.8;
                const duration = 40 + Math.random() * 20;

                letter.style.left = `${startX}px`;
                letter.style.top = `${startY}px`;
                letter.style.fontSize = `${2 + Math.random() * 4}rem`; // Random size
                letter.style.setProperty('--x-end', endX - startX);
                letter.style.setProperty('--y-end', endY - startY);
                letter.style.animationName = 'drift';
                letter.style.animationDuration = `${duration}s`;
                letter.style.animationDelay = `${Math.random() * duration}s`;

                backgroundContainer.appendChild(letter);
            }
        };

        // Update display values when sliders change
        initialPInput.addEventListener('input', () => {
            pValueDisplay.textContent = initialPInput.value;
        });
        popSizeInput.addEventListener('input', () => {
            nValueDisplay.textContent = popSizeInput.value;
        });
        generationsInput.addEventListener('input', () => {
            genValueDisplay.textContent = generationsInput.value;
        });

        /**
         * Draws the allele frequency plot on the canvas.
         */
        const drawPlot = () => {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const numGenerations = parseInt(generationsInput.value);

            // Set canvas size for high-res drawing
            canvas.width = width * devicePixelRatio;
            canvas.height = height * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);

            // Clear the canvas
            ctx.fillStyle = '#1f2937'; // A slightly darker gray than the card for contrast
            ctx.fillRect(0, 0, width, height);

            // Define plot area padding
            const padding = { top: 20, right: 20, bottom: 50, left: 60 };
            const plotWidth = width - padding.left - padding.right;
            const plotHeight = height - padding.top - padding.bottom;

            // Draw axes and labels
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;
            
            // X-axis
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top + plotHeight);
            ctx.lineTo(padding.left + plotWidth, padding.top + plotHeight);
            ctx.stroke();

            // Y-axis
            ctx.beginPath();
            ctx.moveTo(padding.left, padding.top);
            ctx.lineTo(padding.left, padding.top + plotHeight);
            ctx.stroke();

            ctx.fillStyle = '#cbd5e1'; // Lighter gray for text
            ctx.font = '14px Inter';
            ctx.textAlign = 'center';
            ctx.fillText('Generations', padding.left + plotWidth / 2, height - 15);
            
            ctx.save();
            ctx.translate(20, padding.top + plotHeight / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('Allele Frequency', 0, 0);
            ctx.restore();

            // Draw Y-axis frequency markers
            ctx.font = '12px Inter';
            ctx.textAlign = 'right';
            for (let i = 0; i <= 10; i++) {
                const y = padding.top + plotHeight - (i / 10) * plotHeight;
                ctx.fillText((i / 10).toFixed(1), padding.left - 10, y + 4);
                ctx.beginPath();
                ctx.moveTo(padding.left - 5, y);
                ctx.lineTo(padding.left, y);
                ctx.stroke();
            }

            // Draw X-axis generation markers
             ctx.textAlign = 'center';
            const numTicks = 5;
            for (let i = 0; i <= numTicks; i++) {
                const gen = Math.floor((numGenerations / numTicks) * i);
                const x = padding.left + (gen / numGenerations) * plotWidth;
                ctx.fillText(gen, x, padding.top + plotHeight + 20);
            }
            
            /**
             * Helper function to draw a line on the canvas.
             * @param {number[]} history - Array of frequency values.
             * @param {string} color - The color of the line.
             */
            const drawLine = (history, color) => {
                if (!history || history.length < 2) return;
                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                
                let x = padding.left;
                let y = padding.top + plotHeight - history[0] * plotHeight;
                ctx.moveTo(x, y);
                
                for (let i = 1; i < history.length; i++) {
                    x = padding.left + (i / numGenerations) * plotWidth;
                    y = padding.top + plotHeight - history[i] * plotHeight;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            };

            // Draw the p and q lines if history exists
            drawLine(pHistory, '#ef4444'); // Red for p
            drawLine(qHistory, '#60a5fa'); // Blue for q


            // Draw hover line and data if cursor is over the plot
            if (hoverGeneration !== null) {
                const x = padding.left + (hoverGeneration / numGenerations) * plotWidth;
                const p_y = padding.top + plotHeight - hoverP * plotHeight;
                const q_y = padding.top + plotHeight - hoverQ * plotHeight;
                
                // Draw vertical line
                ctx.strokeStyle = '#a0aec0';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + plotHeight);
                ctx.stroke();
                ctx.setLineDash([]); // Reset line dash

                // Draw dots on the lines
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(x, p_y, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#60a5fa';
                ctx.beginPath();
                ctx.arc(x, q_y, 5, 0, Math.PI * 2);
                ctx.fill();

                // Draw tooltip box
                const tooltipWidth = 120;
                const tooltipHeight = 65;
                let tooltipX = x + 15;
                if (tooltipX + tooltipWidth > width) {
                    tooltipX = x - tooltipWidth - 15;
                }

                ctx.fillStyle = 'rgba(45, 55, 72, 0.9)';
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(tooltipX, padding.top + 5, tooltipWidth, tooltipHeight, 5);
                ctx.fill();
                ctx.stroke();


                ctx.fillStyle = '#e5e7eb';
                ctx.font = '13px Inter';
                ctx.textAlign = 'left';
                ctx.fillText(`Gen: ${hoverGeneration}`, tooltipX + 10, padding.top + 25);
                ctx.fillText(`p (A): ${hoverP.toFixed(3)}`, tooltipX + 10, padding.top + 45);
                ctx.fillText(`q (a): ${hoverQ.toFixed(3)}`, tooltipX + 10, padding.top + 65);
            }
        };

        /**
         * Simulates a single generation step.
         */
        const stepSimulation = () => {
            const N = parseInt(popSizeInput.value);
            const w_AA = parseFloat(w_aaInput.value);
            const w_Aa = parseFloat(w_aAInput.value);
            const w_aa = parseFloat(w_aa_recessiveInput.value);

            // Step 1: Calculate new allele frequency after selection
            const q = 1 - p;
            const meanFitness = (p * p * w_AA) + (2 * p * q * w_Aa) + (q * q * w_aa);

            if (meanFitness === 0) {
                p = (p > 0.5) ? 1 : 0; // Fixation or loss if population dies out
                return;
            }

            const p_after_selection = ((p * p * w_AA) + (p * q * w_Aa)) / meanFitness;

            // Step 2: Simulate genetic drift using binomial sampling
            // The number of 'A' alleles in the next generation is drawn from a binomial distribution
            // with 2N trials and a success probability of p_after_selection.
            const num_A_alleles = binomial(2 * N, p_after_selection);
            
            // Step 3: Calculate the new frequency of p for the next generation
            p = num_A_alleles / (2 * N);
        };
        
        /**
         * Generates a random number from a binomial distribution.
         * This is an approximation using Normal distribution for large N.
         * @param {number} n - The number of trials.
         * @param {number} p - The probability of success.
         * @returns {number} A random number from the binomial distribution.
         */
        function binomial(n, p) {
            if (n * p < 10 || n * (1-p) < 10) {
                 // Use simple summation for small expected values
                let successes = 0;
                for (let i = 0; i < n; i++) {
                    if (Math.random() < p) {
                        successes++;
                    }
                }
                return successes;
            } else {
                // Use Normal approximation for large N
                const mean = n * p;
                const stdDev = Math.sqrt(n * p * (1 - p));
                // Box-Muller transform to get a standard normal random variable
                let u = 0, v = 0;
                while(u === 0) u = Math.random(); //Converting [0,1) to (0,1)
                while(v === 0) v = Math.random();
                let z = Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
                
                const result = Math.round(mean + z * stdDev);
                return Math.max(0, Math.min(n, result)); // Ensure result is within [0, n]
            }
        }


        /**
         * The main animation loop.
         */
        const animate = () => {
            if (!isSimulating) {
                return;
            }

            const generations = parseInt(generationsInput.value);
            if (currentGen < generations) {
                stepSimulation();
                currentGen++;
                pHistory.push(p);
                qHistory.push(1 - p);
                
                // Update real-time display
                currentGenDisplay.textContent = currentGen;
                currentPDisplay.textContent = p.toFixed(4);
                currentQDisplay.textContent = (1 - p).toFixed(4);

                drawPlot();
                requestAnimationFrame(animate);
            } else {
                isSimulating = false;
                runButton.textContent = "Run Simulation";
                runButton.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                runButton.classList.add('bg-teal-500', 'hover:bg-teal-600');
                drawPlot(); // Final draw
            }
        };

        /**
         * Resets the simulation to initial parameters.
         */
        const resetSimulation = () => {
            isSimulating = false;
            runButton.textContent = "Run Simulation";
            runButton.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
            runButton.classList.add('bg-teal-500', 'hover:bg-teal-600');
            
            p = parseFloat(initialPInput.value);
            
            pHistory = [p];
            qHistory = [1 - p];
            currentGen = 0;
            
            currentGenDisplay.textContent = currentGen;
            currentPDisplay.textContent = p.toFixed(4);
            currentQDisplay.textContent = (1 - p).toFixed(4);

            drawPlot();
        };

        // Event listeners for buttons
        runButton.addEventListener('click', () => {
            if (isSimulating) {
                isSimulating = false;
                runButton.textContent = "Continue";
                runButton.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
                runButton.classList.add('bg-teal-500', 'hover:bg-teal-600');
            } else {
                if (currentGen >= parseInt(generationsInput.value)) {
                    // If simulation is complete, reset it first
                    resetSimulation();
                }
                isSimulating = true;
                runButton.textContent = "Pause";
                runButton.classList.remove('bg-teal-500', 'hover:bg-teal-600');
                runButton.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                animate();
            }
        });
        
        resetButton.addEventListener('click', resetSimulation);
        
        // Event listeners for mouse hover interactivity
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const numGenerations = parseInt(generationsInput.value);
            
            const padding = { left: 60, right: 20 };
            const plotWidth = width - padding.left - padding.right;
            
            const x_mouse = e.clientX - rect.left;
            
            // Check if mouse is within plot area
            if (x_mouse > padding.left && x_mouse < width - padding.right) {
                const x_plot_area = x_mouse - padding.left;
                
                // Calculate hovered generation based on x-coordinate
                const hoveredGen = Math.round((x_plot_area / plotWidth) * numGenerations);
                
                // Ensure hovered generation is within the bounds of the simulation history
                if (pHistory && hoveredGen >= 0 && hoveredGen < pHistory.length) {
                    hoverGeneration = hoveredGen;
                    hoverP = pHistory[hoveredGen];
                    hoverQ = qHistory[hoveredGen];
                } else {
                    hoverGeneration = null;
                }
            } else {
                hoverGeneration = null;
            }
            // Redraw only if simulation is not running to avoid flicker
            if (!isSimulating) {
                drawPlot();
            }
        });

        canvas.addEventListener('mouseout', () => {
            hoverGeneration = null;
            // Redraw only if simulation is not running
            if (!isSimulating) {
                drawPlot();
            }
        });
        
        // Handle window resizing
        const resizeObserver = new ResizeObserver(() => {
            if (!isSimulating) {
                drawPlot();
            }
        });
        resizeObserver.observe(canvas);

        // Initial setup on page load
        window.onload = function() {
            createBackgroundLetters();
            resetSimulation();
        }
    </script>
</body>
</html>
